name: Bug report
description: Something does not work as the documentation says it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Please check the [handbooks](https://docs.academy.i3-innovation.com/en/) and the open issues first.
        **A vulnerability does not belong here:** use "Report a vulnerability" on the Security tab.
        Leave out personal data, passwords, keys and tokens, also in logs and screenshots.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as a trainer
        2. Open a course and choose …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit or release, e.g. from the footer's "Source code" link or `GET /v1/source`.
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Where it runs
      options:
        - Own server, native installation
        - Own server, Docker Compose
        - Local development
        - Hosted service
        - Learning app (Android, Windows or Linux)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser or device, and anything unusual about the setup.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines only, with secrets removed.
      render: text
